services:
  - type: web
    name: echogen-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ORACLE_WALLET
        sync: false
      - key: SOLANA_CLUSTER
        value: devnet
      - key: HELIUS_API_KEY
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
      - key: CMC_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: NEWSAPI_AI_KEY
        sync: false
